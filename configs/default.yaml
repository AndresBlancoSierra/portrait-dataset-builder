identity: default
output_dir: "data/{identity}"
log_level: INFO
device: auto

database:
  path: "data/{identity}/portrait.db"
  echo: false

search:
  max_results_per_source: 500
  enabled_sources:
    - duckduckgo
    - flickr
  search_delay: 2.0

download:
  max_concurrent: 10
  timeout: 30
  retries: 3
  min_image_size: 200
  max_image_size: 20000
  allowed_formats:
    - jpg
    - jpeg
    - png
    - webp
    - bmp

video:
  enabled_sources:
    - youtube
  max_videos: 0
  max_duration: 3600
  min_duration: 10
  download_quality: "best[height<=1080]"

frame_extraction:
  min_difference: 0.15
  max_frames_per_video: 500
  sample_fps: 1.0
  ssim_threshold: 0.7
  histogram_threshold: 0.3
  landmark_shift_threshold: 5.0

face_detection:
  detector: insightface
  model_name: buffalo_l
  min_confidence: 0.5
  min_face_size: 50
  max_faces_per_image: 10

face_verification:
  recognizer: arcface
  model_name: buffalo_l
  strict_threshold: 0.50
  normal_threshold: 0.45
  permissive_threshold: 0.35
  mode: strict
  seed_images_min: 3
  seed_images_max: 20

quality:
  min_resolution: 300
  min_quality_score: 0.3
  weights:
    resolution: 0.10
    sharpness: 0.20
    blur: 0.15
    noise: 0.10
    lighting: 0.10
    occlusion: 0.10
    face_size: 0.10
    frontal: 0.10
    jpeg: 0.05

duplicates:
  phash_threshold: 8
  dhash_threshold: 8
  embedding_similarity_threshold: 0.95
  ssim_threshold: 0.92
  enabled_methods:
    - phash
    - dhash
    - embedding

classification:
  yaw_frontal_threshold: 15.0
  yaw_profile_threshold: 60.0
  pitch_up_threshold: -15.0
  pitch_down_threshold: 15.0

semantic_filter:
  clip_model: ViT-B-32
  clip_pretrained: openai
  pos_threshold: 0.22
  neg_threshold: 0.27

export:
  image_format: jpg
  jpeg_quality: 95
  max_export_size: 2000
  include_metadata: true

safety:
  nsfw_model: "Falconsai/nsfw_image_detection"
  nsfw_threshold: 0.20
  clip_safety_threshold: 0.50
  ai_mode: "strict"
  ai_metadata_threshold: 0.70
  blocked_url_keywords:
    - porn
    - xxx
    - sex
    - nude
    - naked
    - erotic
    - onlyfans
    - nsfw
    - adult
    - playboy
    - penthouse
  source_trust_scores:
    official: 1.0
    editorial: 1.0
    wikimedia: 0.95
    wikipedia: 0.95
    flickr: 0.90
    imdb: 0.90
    duckduckgo: 0.70
    google: 0.70
    bing: 0.70
    unknown: 0.30
  fail_closed: true

pipeline:
  checkpoint_enabled: true
  max_retries: 3
  batch_size: 50
  target_images: 200
  max_candidate_pool: 500
  early_stop_coverage: 0.85
  early_stop_quality: 0.75
  max_concurrent_builds: 1
  stages:
    - search
    - url_safety_filter
    - identity_bootstrap
    - download
    - safety_gate
    - face_detection
    - face_verification
    - semantic_filter
    - quality
    - duplicates
    - classification
    - export

identity_bootstrap:
  enabled: true
  candidate_count: 50
  min_candidates: 5
  target_seeds: 12
  max_seeds: 20
  similarity_threshold: 0.4
  min_cluster_size: 3
  min_identity_confidence: 0.75
  min_face_quality: 0.3
  min_face_size: 40

compute:
  device: auto
  gpu_batch_size: 4
  inference_max_dimension: 1600
  cpu_workers: 2
  gpu_semaphore: 1

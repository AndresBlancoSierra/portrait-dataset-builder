[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portrait-dataset-builder"
version = "0.1.0"
description = "A tool for building curated portrait datasets from images and video"
requires-python = ">=3.12"
license = "MIT"
keywords = ["portrait", "dataset", "face-detection", "image-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "pydantic-settings[yaml]>=2.0.0",
    "SQLAlchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    # Image/Video
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    # Face detection/recognition
    "insightface>=0.7.3",
    "onnxruntime-gpu>=1.16.0",
    # Hashing
    "imagehash>=4.3.0",
    # Web/Search
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=4.0.0",
    "yt-dlp>=2024.1.0",
    # ML
    "scikit-learn>=1.3.0",
    "scikit-image>=0.22.0",
    "polars>=0.20.0",
    # Vector search
    "usearch>=2.0.0",
    # CLIP
    "open-clip-torch>=2.24.0",
    # Config
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "transformers>=5.14.1",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
portrait-dataset = "portrait_dataset_builder.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/portrait_dataset_builder"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "benchmark: marks tests as benchmark tests (deselect with '-m not benchmark')",
]
